
searches:

  # ==========================================
  # SEARCH 1: AVIONICS & FLIGHT CONTROLS
  # Broader title terms catch role variants while Singapore remains the
  # geographic filter. These cover avionics, ATA 22/23/34/42 and integration.
  # ==========================================

  - name: "Avionics & Flight Controls - Singapore"

    keywords:
      - "Avionics"
      - "Flight Control"
      - "Autoflight"
      - "Navigation Systems"
      - "Aircraft Communications"
      - "Integrated Modular Avionics"
      - "Aircraft Systems"
      - "Systems Integration"
      - "Flight Management"
      - "Avionics Test"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 2: ELECTRICAL SYSTEMS
  # Covers ATA 24/33/80 and aircraft electrical power.
  # ==========================================

  - name: "Aircraft Electrical Systems - Singapore"

    keywords:
      - "Aircraft Electrical"
      - "Electrical Systems"
      - "Electrical Power"
      - "Power Systems"
      - "Aircraft Power"
      - "Aerospace Electrical"
      - "Aircraft Lighting"
      - "Aircraft Starting"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 3: INSTRUMENTATION & DIAGNOSTICS
  # Covers ATA 31/45, flight data, maintenance and in-service support.
  # ==========================================

  - name: "Aircraft Instrumentation & Diagnostics - Singapore"

    keywords:
      - "Instrumentation"
      - "Flight Data"
      - "Diagnostics"
      - "Health Monitoring"
      - "Maintenance Systems"
      - "Technical Support"
      - "In-Service Support"
      - "Reliability Engineer"
      - "Test Engineer"
      - "Aircraft Systems"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 4: ATR / SELETAR
  # Company name is included in local matching, not just the job title.
  # ==========================================

  - name: "ATR - Singapore"

    keywords:
      - "ATR"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


# ==========================================
# EMAIL NOTIFICATIONS
# ==========================================

notifications:

  email:
    enabled: true
    recipients: []
    subject_prefix: "[Aerospace Job Alert]"
    host: "smtp.gmail.com"
    port: 587
    use_ssl: false

  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: ""
    priority: default


# ==========================================
# GENERAL SETTINGS
# ==========================================

settings:

  hours: 24
  request_delay_seconds: 3
  state_file: "state/seen_jobs.json"
  forget_after_days: 30
