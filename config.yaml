searches:

  # ==========================================
  # SEARCH 1: AIRBUS / TOULOUSE / AVIONICS
  # ==========================================

  - name: "Airbus Toulouse - Avionics Engineering"

    keywords:
      - "avionique"

    location: "Toulouse"
    company_include:
      - "Airbus"
    match_mode: any

    exclude:
      - "stage"
      - "stagiaire"
      - "alternance"
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SINGAPORE SEARCH 1: AVIONICS & AIRCRAFT SYSTEMS
  # ==========================================

  - name: "Singapore - Avionics & Aircraft Systems"

    keywords:
      - "Avionics Engineer"
      - "Avionics Systems Engineer"
      - "Avionics"
      - "Aircraft Systems Engineer"
      - "Aircraft Systems Integration Engineer"
      - "Aircraft Electrical Systems Engineer"
      - "Aviation Systems Engineer"
      - "Aircraft Systems"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"
      - "defence"
      - "defense"
      - "military"
      - "militaire"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SINGAPORE SEARCH 2: FLIGHT CONTROLS & AVIONICS SYSTEMS
  # ==========================================

  - name: "Singapore - Flight Controls & Avionics Systems"

    keywords:
      - "Flight Controls Engineer"
      - "Flight Control Systems Engineer"
      - "Autoflight Systems Engineer"
      - "Flight Management Systems Engineer"
      - "Navigation Systems Engineer"
      - "Aircraft Communications Engineer"
      - "Integrated Modular Avionics Engineer"
      - "Avionics Integration Engineer"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"
      - "defence"
      - "defense"
      - "military"
      - "militaire"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SINGAPORE SEARCH 3: IN-SERVICE & TECHNICAL SUPPORT
  # ==========================================

  - name: "Singapore - In-Service & Technical Support"

    keywords:
      - "Aircraft Technical Support Engineer"
      - "Avionics Support Engineer"
      - "In-Service Support Engineer"
      - "Aircraft Support Engineer"
      - "Aerospace Product Support Engineer"
      - "Fleet Support Engineer"
      - "Technical Services Engineer Aviation"
      - "Customer Support Engineer Aviation"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"
      - "defence"
      - "defense"
      - "military"
      - "militaire"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SINGAPORE SEARCH 4: RELIABILITY, MRO, TEST & ATR
  # ==========================================

  - name: "Singapore - Reliability, MRO, Test & ATR"

    keywords:
      - "Aircraft Reliability Engineer"
      - "Aircraft Maintenance Engineer"
      - "Maintenance Planning Engineer"
      - "Aircraft Production Support Engineer"
      - "Aircraft Manufacturing Engineer"
      - "Airworthiness Engineer"
      - "Aircraft Test Engineer"
      - "Avionics Test Engineer"
      - "ATR Engineer"
      - "ATR Technical Support Engineer"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"
      - "defence"
      - "defense"
      - "military"
      - "militaire"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


# ==========================================
# EMAIL NOTIFICATIONS
# ==========================================

notifications:

  email:
    enabled: true
    recipients: []
    subject_prefix: "[Aerospace Job Alert]"
    host: "smtp.gmail.com"
    port: 587
    use_ssl: false

  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: ""
    priority: default


# ==========================================
# GENERAL SETTINGS
# ==========================================

settings:

  hours: 24
  request_delay_seconds: 3
  state_file: "state/seen_jobs.json"
  forget_after_days: 30
