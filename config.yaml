
searches:

  # ==========================================
  # SEARCH 1: AVIONICS & FLIGHT CONTROLS
  # ==========================================

  - name: "Avionics & Flight Controls - Singapore"

    keywords:
      - "Aircraft Systems Engineer"
      - "Avionics Systems Engineer"
      - "Avionics Engineer"
      - "Flight Controls Engineer"
      - "Flight Control Systems Engineer"
      - "Autoflight Systems Engineer"
      - "Navigation Systems Engineer"
      - "Aircraft Communications Engineer"
      - "Integrated Modular Avionics Engineer"
      - "Aircraft Systems Integration Engineer"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 2: ELECTRICAL SYSTEMS
  # ==========================================

  - name: "Aircraft Electrical Systems - Singapore"

    keywords:
      - "Aircraft Electrical Engineer"
      - "Aircraft Electrical Systems Engineer"
      - "Electrical Systems Engineer Aerospace"
      - "Electrical Power Systems Engineer"
      - "Aircraft Power Systems Engineer"
      - "Aerospace Electrical Engineer"
      - "Aircraft Lighting Systems Engineer"
      - "Aircraft Starting Systems Engineer"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 3: INSTRUMENTATION & DIAGNOSTICS
  # ==========================================

  - name: "Aircraft Instrumentation & Diagnostics - Singapore"

    keywords:
      - "Aircraft Instrumentation Engineer"
      - "Flight Data Systems Engineer"
      - "Flight Data Recorder Engineer"
      - "Aircraft Diagnostics Engineer"
      - "Aircraft Health Monitoring Engineer"
      - "Aircraft Maintenance Systems Engineer"
      - "Aircraft Technical Support Engineer"
      - "In-Service Support Engineer"
      - "Aircraft Reliability Engineer"
      - "Avionics Test Engineer"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 4: ATR / SELETAR
  # ==========================================

  - name: "ATR - Singapore"

    keywords:
      - "ATR"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


# ==========================================
# EMAIL NOTIFICATIONS
# ==========================================

notifications:

  email:
    enabled: true
    recipients: []
    subject_prefix: "[Aerospace Job Alert]"
    host: "smtp.gmail.com"
    port: 587
    use_ssl: false

  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: ""
    priority: default


# ==========================================
# GENERAL SETTINGS
# ==========================================

settings:

  hours: 24
  request_delay_seconds: 3
  state_file: "state/seen_jobs.json"
  forget_after_days: 30
