
searches:

  # ==========================================
  # SEARCH 1: AVIONICS / FLIGHT SYSTEMS
  # Civil aviation engineering roles in Singapore.
  # ==========================================

  - name: "Avionics & Flight Systems - Singapore"

    keywords:
      - "Avionics"
      - "Avionics Systems"
      - "Aircraft Systems Engineer"
      - "Aircraft Systems"
      - "Flight Controls"
      - "Flight Control Systems"
      - "Autoflight"
      - "Flight Management Systems"
      - "Aircraft Navigation Systems"
      - "Aircraft Communications"

    location: "France"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 2: CUSTOMER / TECHNICAL / PRODUCT SUPPORT
  # Keep support searches tied to aircraft, avionics or aerospace.
  # ==========================================

  - name: "Aircraft & Avionics Customer Support - Singapore"

    keywords:
      - "Avionics Support"
      - "Aircraft Support Engineer"
      - "Aircraft Customer Support"
      - "Aircraft Technical Support"
      - "Aircraft Product Support"
      - "Aerospace Customer Support"
      - "Aerospace Technical Support"
      - "Aerospace Product Support"
      - "In-Service Support Engineer"
      - "Customer Support Avionics"

    location: "France"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 3: AIRCRAFT / AEROSPACE SYSTEMS ENGINEERING
  # Avoid generic "Systems Engineer" which brings IT and unrelated sectors.
  # ==========================================

  - name: "Aircraft Systems Engineering - Singapore"

    keywords:
      - "Aircraft Systems Engineering"
      - "Aircraft Systems Engineer"
      - "Aerospace Systems Engineer"
      - "Aviation Systems Engineer"
      - "Aircraft System Integration"
      - "Aircraft Systems Integration"
      - "Aircraft Systems Support"
      - "Avionics Systems Engineer"
      - "Aircraft Electrical Systems"
      - "Flight Systems Engineer"

    location: "France"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


# ==========================================
# EMAIL NOTIFICATIONS
# ==========================================

notifications:

  email:
    enabled: true
    recipients: []
    subject_prefix: "[Aerospace Job Alert]"
    host: "smtp.gmail.com"
    port: 587
    use_ssl: false

  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: ""
    priority: default


# ==========================================
# GENERAL SETTINGS
# ==========================================

settings:

  hours: 24
  request_delay_seconds: 3
  state_file: "state/seen_jobs.json"
  forget_after_days: 30
