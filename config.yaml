
searches:

  # ==========================================
  # SEARCH 1: AIRBUS / TOULOUSE / AVIONIQUE
  # French engineering job titles containing "avionique".
  # Employer is restricted to Airbus.
  # ==========================================

  - name: "Airbus Toulouse - Ingénierie avionique"

    keywords:
      - "avionique"

    location: "Toulouse"
    company_include:
      - "Airbus"
    match_mode: any

    exclude:
      - "stage"
      - "stagiaire"
      - "alternance"
      - "intern"
      - "internship"
      - "trainee"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


  # ==========================================
  # SEARCH 2: CIVIL AVIATION / AVIONICS ENGINEERING
  # Singapore-based roles across civil aviation employers.
  # ==========================================

  - name: "Civil Aviation Avionics Engineering - Singapore"

    keywords:
      - "Avionics Engineer"
      - "Avionics Systems Engineer"
      - "Avionics"
      - "Aircraft Systems Engineer"
      - "Aircraft Systems Integration Engineer"
      - "Flight Controls Engineer"
      - "Aircraft Technical Support Engineer"
      - "Avionics Support Engineer"
      - "Aviation Systems Engineer"
      - "Aircraft Electrical Systems Engineer"

    location: "Singapore"
    match_mode: any

    exclude:
      - "intern"
      - "internship"
      - "trainee"
      - "defence"
      - "defense"
      - "military"
      - "militaire"

    remote_only: false
    recipients: []
    max_results: 25
    enabled: true


# ==========================================
# EMAIL NOTIFICATIONS
# ==========================================

notifications:

  email:
    enabled: true
    recipients: []
    subject_prefix: "[Aerospace Job Alert]"
    host: "smtp.gmail.com"
    port: 587
    use_ssl: false

  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: ""
    priority: default


# ==========================================
# GENERAL SETTINGS
# ==========================================

settings:

  hours: 24
  request_delay_seconds: 3
  state_file: "state/seen_jobs.json"
  forget_after_days: 30

